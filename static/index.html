<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bebidas da Viagem</title>
<style>
:root{color-scheme:dark;--bg:#0e0e10;--panel:#17171a;--line:#2b2b30;--tx:#ece8df;--mut:#9a968c;--alc:#c9a24b;--sem:#6f9fc4;--bad:#d4604f;--btn:#c9a24b;--btnt:#14120c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f6f3ec;--panel:#fff;--line:#ddd7c8;--tx:#1d1b17;--mut:#6b665a;--alc:#8a6a1d;--sem:#2f6a99;--bad:#b0402f;--btn:#1d1b17;--btnt:#f6f3ec}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 28px/1.1 Georgia,"Times New Roman",serif;margin:0 0 4px;letter-spacing:.2px}
h2{font:600 16px/1.2 Georgia,serif;color:var(--mut);margin:28px 0 10px}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:14px}
.card b{display:block;font:600 26px/1.1 Georgia,serif;margin-top:6px}
.card span{font-size:12px;color:var(--mut);}
.card.a{border-top:2px solid var(--alc)}.card.s{border-top:2px solid var(--sem)}.card.t{border-top:2px solid var(--tx)}
.card small{color:var(--mut);font-size:13px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:10px;width:100%;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--alc);outline-offset:1px}
form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:14px}
form>div:nth-child(1){grid-column:span 2}form>div:nth-child(2){grid-column:span 2}form>div:nth-child(3){grid-column:span 2}
form>div:nth-child(4),form>div:nth-child(5){grid-column:span 2}form>div:nth-child(6){grid-column:span 2;display:flex;align-items:flex-end}
.go{background:var(--btn);color:var(--btnt);border-color:var(--btn);font-weight:600;cursor:pointer}
.ghost{width:auto;cursor:pointer;padding:8px 12px;min-height:40px}
@media (max-width:640px){form{grid-template-columns:1fr 1fr}form>div{grid-column:span 2!important}form>div:nth-child(4),form>div:nth-child(5){grid-column:span 1!important}}
.bar{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.track{background:var(--panel);border:1px solid var(--line);height:14px;border-radius:2px;overflow:hidden}
.fill{height:100%}.fill.alc{background:var(--alc)}.fill.sem{background:var(--sem)}
.bar i{font-style:normal;text-align:right;color:var(--mut)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{width:auto;cursor:pointer;padding:8px 14px;min-height:40px}
.tabs button[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:2px;padding:10px 12px;margin-bottom:6px}
.row.alc{border-left-color:var(--alc)}.row.sem{border-left-color:var(--sem)}
.row small{display:block;color:var(--mut)}
.row button{width:auto;min-height:36px;padding:6px 10px;cursor:pointer;color:var(--mut)}
.row button.arm{color:var(--bad);border-color:var(--bad)}
.empty{color:var(--mut);padding:18px;border:1px dashed var(--line);border-radius:2px;text-align:center}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px;}
td:last-child,th:last-child{text-align:right}
#st{font-size:13px;color:var(--mut);margin-top:10px;min-height:20px}#st.err{color:var(--bad)}
.pp{width:120px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Bebidas da Viagem</h1>
      <p class="sub">Cada um registra o que vai levar. Os totais se atualizam sozinhos.</p>
    </div>
    <div class="pp"><label for="pp">Pessoas no grupo</label><input id="pp" type="number" min="1" value="15" inputmode="numeric"></div>
  </div>

  <div class="cards" id="cards"></div>

  <h2>Adicionar bebida</h2>
  <form id="f" autocomplete="off">
    <div><label for="who">Quem leva</label><input id="who" required maxlength="40" placeholder="Seu nome"></div>
    <div><label for="tipo">Tipo</label><select id="tipo" required></select></div>
    <div><label for="det">Marca ou detalhe (opcional)</label><input id="det" maxlength="60" placeholder="Ex.: Tanqueray, uva"></div>
    <div><label for="qtd">Quantidade</label><input id="qtd" type="number" min="1" max="500" value="1" inputmode="numeric" required></div>
    <div><label for="tam">Tamanho de cada</label>
      <select id="tam"><option value="350">Lata 350 ml</option><option value="600">600 ml</option><option value="750" selected>Garrafa 750 ml</option><option value="1000">1 L</option><option value="1500">1,5 L</option><option value="2000">2 L</option><option value="5000">Galão 5 L</option><option value="0">Outro (ml)...</option></select>
      <input id="outro" type="number" min="1" placeholder="ml" inputmode="numeric" hidden style="margin-top:6px"></div>
    <div><button class="go" type="submit">Adicionar</button></div>
  </form>
  <div id="st" role="status"></div>

  <h2>Total por tipo</h2>
  <div id="bars"></div>

  <h2>Quem leva o quê</h2>
  <div class="scroll"><table id="pessoas"></table></div>

  <h2>Lista completa</h2>
  <div class="tabs" id="tabs">
    <button type="button" data-f="all" aria-pressed="true">Todas</button>
    <button type="button" data-f="alc" aria-pressed="false">Alcoólicas</button>
    <button type="button" data-f="sem" aria-pressed="false">Sem álcool</button>
    <button type="button" id="copy" class="ghost" style="margin-left:auto">Copiar resumo</button>
  </div>
  <div id="list"></div>
</main>

<script>
const TIPOS={alc:["Whisky","Vodka","Gin","Cerveja","Vinho","Espumante","Tequila","Rum","Cachaça","Licor","Outra alcoólica"],
             sem:["Água","Refrigerante","Suco","Água de coco","Energético","Outra sem álcool"]};
const kind=t=>TIPOS.alc.includes(t)?"alc":"sem";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n.toLocaleString("pt-BR",{maximumFractionDigits:2});
const fmtL=n=>fmt(n)+" L";
const fmtTam=ml=>ml>=1000?fmt(ml/1000)+" L":ml+" ml";
let items=[],filter="all",col=null,LS="bebidas-viagem-v1";

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function status(msg,err){const s=$("st");s.textContent=msg;s.className=err?"err":""}

$("tipo").innerHTML='<optgroup label="Alcoólicas">'+TIPOS.alc.map(t=>`<option>${t}</option>`).join("")+
  '</optgroup><optgroup label="Sem álcool">'+TIPOS.sem.map(t=>`<option>${t}</option>`).join("")+'</optgroup>';
$("tam").onchange=()=>{$("outro").hidden=$("tam").value!=="0";if(!$("outro").hidden)$("outro").focus()};
$("pp").value=lsGet("bebidas-pessoas",15);
$("pp").oninput=()=>{lsSet("bebidas-pessoas",+$("pp").value||1);render()};
$("who").value=lsGet("bebidas-nome","");

function render(){
  const tot=items.reduce((a,i)=>a+i.litros,0);
  const alc=items.filter(i=>kind(i.tipo)==="alc").reduce((a,i)=>a+i.litros,0);
  const sem=tot-alc,pp=Math.max(1,+$("pp").value||1);
  const pct=n=>tot?Math.round(n/tot*100)+"% do total":"sem itens";
  $("cards").innerHTML=
   `<div class="card t"><span>Total</span><b>${fmtL(tot)}</b><small>${items.length} itens</small></div>`+
   `<div class="card a"><span>Alcoólicas</span><b>${fmtL(alc)}</b><small>${pct(alc)}</small></div>`+
   `<div class="card s"><span>Sem álcool</span><b>${fmtL(sem)}</b><small>${pct(sem)}</small></div>`+
   `<div class="card"><span>Por pessoa</span><b>${fmtL(tot/pp)}</b><small>${fmtL(alc/pp)} alcoólicas</small></div>`;

  const by={};items.forEach(i=>by[i.tipo]=(by[i.tipo]||0)+i.litros);
  const ord=Object.entries(by).sort((a,b)=>b[1]-a[1]),max=ord.length?ord[0][1]:1;
  $("bars").innerHTML=ord.length?ord.map(([t,l])=>`<div class="bar"><span>${esc(t)}</span><div class="track"><div class="fill ${kind(t)}" style="width:${l/max*100}%"></div></div><i>${fmtL(l)}</i></div>`).join(""):'<div class="empty">Nenhuma bebida cadastrada ainda.</div>';

  const pe={};items.forEach(i=>{const p=pe[i.who]=pe[i.who]||{l:0,d:[]};p.l+=i.litros;p.d.push(`${i.qtd}x ${i.tipo}`)});
  const pr=Object.entries(pe).sort((a,b)=>b[1].l-a[1].l);
  $("pessoas").innerHTML=pr.length?'<tr><th>Pessoa</th><th>Leva</th><th>Total</th></tr>'+pr.map(([n,p])=>`<tr><td>${esc(n)}</td><td>${esc(p.d.join(", "))}</td><td>${fmtL(p.l)}</td></tr>`).join(""):'<tr><td style="color:var(--mut)">Ninguém registrou ainda.</td></tr>';

  const vis=items.filter(i=>filter==="all"||kind(i.tipo)===filter).sort((a,b)=>(a.tipo>b.tipo)-(a.tipo<b.tipo));
  $("list").innerHTML=vis.length?vis.map(i=>`<div class="row ${kind(i.tipo)}"><div>${i.qtd}x ${esc(i.tipo)}${i.det?" · "+esc(i.det):""}<small>${esc(i.who)} · ${fmtTam(i.ml)} cada · ${kind(i.tipo)==="alc"?"Alcoólica":"Sem álcool"}</small></div><b>${fmtL(i.litros)}</b><button type="button" data-id="${esc(i.id)}">Remover</button></div>`).join(""):'<div class="empty">Nada por aqui.</div>';
}

$("tabs").onclick=e=>{const b=e.target.closest("button[data-f]");if(!b)return;filter=b.dataset.f;
  document.querySelectorAll("#tabs [data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()};

$("list").onclick=async e=>{const b=e.target.closest("button[data-id]");if(!b)return;
  if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="Confirmar";setTimeout(()=>{b.classList.remove("arm");b.textContent="Remover"},3000);return}
  try{await api("DELETE","/"+b.dataset.id);await load()}catch(err){status(err.message,1)}};

$("f").onsubmit=async e=>{e.preventDefault();
  const ml=$("tam").value==="0"?+$("outro").value:+$("tam").value,qtd=Math.max(1,Math.floor(+$("qtd").value));
  if(!ml||!qtd){status("Informe quantidade e tamanho.",1);return}
  const who=$("who").value.trim();lsSet("bebidas-nome",who);
  const it={who,tipo:$("tipo").value,det:$("det").value.trim(),qtd,ml,litros:qtd*ml/1000,ts:Date.now()};
  try{await api("POST","",it);await load()}catch(err){status(err.message,1);return}
  $("det").value="";$("qtd").value=1;status("Adicionado.")};

$("copy").onclick=async()=>{
  const tot=items.reduce((a,i)=>a+i.litros,0),by={};items.forEach(i=>by[i.tipo]=(by[i.tipo]||0)+i.litros);
  const txt="Bebidas da viagem\nTotal: "+fmtL(tot)+"\n"+Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([t,l])=>`- ${t}: ${fmtL(l)}`).join("\n");
  try{await navigator.clipboard.writeText(txt);status("Resumo copiado.")}catch(e){status("Não foi possível copiar neste navegador.",1)}};

const CODE=new URLSearchParams(location.search).get("codigo")||"";
let last="";
async function api(method,path,body){
  const r=await fetch("/api/bebidas"+path,{method,headers:{"Content-Type":"application/json","X-Code":CODE},body:body?JSON.stringify(body):undefined});
  if(r.status===401)throw new Error("Link sem o código de acesso. Peça o link completo ao organizador.");
  if(!r.ok){let m="Erro ao salvar ("+r.status+").";try{m=(await r.json()).erro||m}catch(e){}throw new Error(m)}
  return r.status===204?null:r.json();
}
async function load(){
  try{const n=await api("GET",""),j=JSON.stringify(n);if(j!==last){last=j;items=n;render()}
    status("Atualizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+". A lista se atualiza sozinha.")}
  catch(e){status(e.message,1)}
}
load();setInterval(()=>{if(!document.hidden)load()},10000);
</script>
</body>
</html>
